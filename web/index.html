<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="#/"><span class="logo-mark" aria-hidden="true"></span><span dir="ltr">Next Call</span></a>
    <nav class="nav" aria-label="ניווט ראשי">
      <a href="#/today" data-nav="today">השיחות של היום</a>
      <a href="#/import" data-nav="import">קובץ לידים חדש</a>
      <a href="#/system" data-nav="system">מאחורי הקלעים</a>
    </nav>
    <span class="mode" id="mode" hidden></span>
  </div>
</header>
<main class="wrap" id="view" tabindex="-1"></main>
<footer class="wrap foot">
  <span dir="ltr">Next Call</span> · שני צוותי CrewAI, חוזה נתונים ושער בדיקה ביניהם ·
  <a href="https://github.com/ethanmuli-collab/next-call" target="_blank" rel="noopener">GitHub</a>
</footer>
<dialog id="viewer" class="viewer">
  <div class="viewer-head">
    <strong id="viewer-title" dir="ltr"></strong>
    <span class="viewer-actions">
      <a id="viewer-dl" class="btn small" href="#">הורדה</a>
      <button class="btn small" id="viewer-close" type="button">סגירה</button>
    </span>
  </div>
  <div id="viewer-body" class="viewer-body" dir="ltr"></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/assets/app.js"></script>
</body>
</html>
